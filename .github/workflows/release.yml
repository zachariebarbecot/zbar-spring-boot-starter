name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag format
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG does not match vX.Y.Z"; exit 1; }
      - name: Validate tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $TAG is not an ancestor of origin/main"; exit 1; }
      - name: Fail if release already exists
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Set version
        run: ./mvnw -B -ntp versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false -pl '!.'
      - name: Verify
        run: ./mvnw -B -ntp -Dmaven.build.cache.enabled=false verify -Dsurefire.rerunFailingTestsCount=2 -Dfailsafe.rerunFailingTestsCount=2
      - name: Deploy
        run: ./mvnw -B -ntp -Dmaven.build.cache.enabled=false -DskipTests deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        run: |
          mkdir dist
          version="${TAG#v}"
          find . -path '*/target/*.jar' -not -name 'original-*' -exec cp {} dist/ \;
          for pom in zbar-*/pom.xml; do
            cp "$pom" "dist/$(dirname "$pom")-${version}.pom"
          done
          gh release create "$TAG" --generate-notes --title "$TAG" dist/*
