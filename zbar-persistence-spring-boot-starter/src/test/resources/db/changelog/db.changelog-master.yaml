databaseChangeLog:
  - changeSet:
      id: 1
      author: zbar
      changes:
        - createSequence:
            sequenceName: audited_entity_seq
            incrementBy: 50
  - changeSet:
      id: 2
      author: zbar
      changes:
        - createTable:
            tableName: audited_entity
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
